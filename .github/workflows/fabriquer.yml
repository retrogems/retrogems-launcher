# Fabrique gratuitement les installateurs de l'application RetroGems (Windows, Linux / Steam Deck, macOS, Android)
# à chaque envoi sur la branche main, et les publie dans « Releases ». Le site retrogems.fr les copie ensuite tout seul.
name: Fabriquer le launcher

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fabriquer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - plateforme: windows-latest
            args: ''
          - plateforme: ubuntu-22.04
            args: ''
          - plateforme: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.plateforme }}
    steps:
      - uses: actions/checkout@v4

      - name: Diagnostic (le site répond-il au programme ?)
        if: matrix.plateforme == 'ubuntu-22.04'
        shell: bash
        run: |
          U="https://retrogems.fr/wp-json/retrogems/v1/launcher/projet/mario-kart-world-recompilation?lg=fr"
          A1="RetroGemsLauncher/0.1"
          A2="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36 Edg/130.0.0.0 RetroGemsLauncher/0.1.5"
          c1=$(curl -s -o /dev/null -w "%{http_code}" -A "$A1" "$U" || true)
          c2=$(curl -s -o r2.json -w "%{http_code}" -A "$A2" -H "Accept: application/json" "$U" || true)
          echo "::warning::DIAG agent-programme=$c1 agent-navigateur=$c2 debut=$(head -c 60 r2.json | tr -d '\n\r\"')"
      - name: Bibliothèques Linux
        if: matrix.plateforme == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.plateforme == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Outils
        run: npm install

      - name: Icônes (icône de l'application RetroGems, la même que la PWA de retrogems.fr)
        shell: bash
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          ok=0
          for u in https://retrogems.fr/pwa-icone-512.png https://www.retrogems.fr/pwa-icone-512.png; do
            if curl -fsSL --retry 3 -A "$UA" -H "Accept: image/png,image/*" "$u" -o icone-site.png && head -c 8 icone-site.png | od -An -tx1 | grep -q "89 50 4e 47"; then ok=1; break; fi
          done
          if [ "$ok" = 1 ]; then cp icone-site.png app-icon.png; echo "Icône de la PWA retrogems.fr utilisée";
          else echo "::warning::Icône de retrogems.fr injoignable depuis GitHub : icône du dépôt (app-icon.png) utilisée"; fi
          npx tauri icon app-icon.png

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'RetroGems v__VERSION__'
          releaseBody: 'Installateurs du launcher RetroGems. Téléchargement conseillé : https://retrogems.fr/launcher/'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # v0.2.2 : application RetroGems pour Android (APK), publiée dans la même version que l'application pour ordinateur.
  # Il faut deux secrets dans le dépôt (Settings › Secrets and variables › Actions) : ANDROID_KEYSTORE_B64 et ANDROID_KEYSTORE_PASSWORD.
  android:
    needs: fabriquer
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Projet Android
        shell: bash
        run: if [ ! -d android ] && [ -f android.zip ]; then unzip -q android.zip; fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Version
        shell: bash
        run: echo "VER=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")" >> "$GITHUB_ENV"

      - name: Icônes (celles de la PWA de retrogems.fr)
        shell: bash
        run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/130.0.0.0 Safari/537.36"
          if curl -fsSL --retry 3 -A "$UA" https://retrogems.fr/pwa-icone-512.png -o icone.png && head -c 8 icone.png | od -An -tx1 | grep -q "89 50 4e 47"; then
            python3 -m pip install --quiet pillow
            python3 - <<'PY'
          from PIL import Image
          im = Image.open('icone.png').convert('RGBA')
          for n, t in [('mdpi', 48), ('hdpi', 72), ('xhdpi', 96), ('xxhdpi', 144), ('xxxhdpi', 192)]:
              im.resize((t, t), Image.LANCZOS).save(f'android/app/src/main/res/mipmap-{n}/ic_launcher.png')
          im.resize((288, 288), Image.LANCZOS).save('android/app/src/main/res/drawable/splash.png')
          PY
          else
            echo "::warning::Icône de retrogems.fr injoignable : icônes du dépôt utilisées"
          fi

      - name: Clé de signature
        id: cle
        shell: bash
        env:
          KEY_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEY_B64" ]; then
            echo "::warning::Secret ANDROID_KEYSTORE_B64 absent : l'APK Android n'est pas fabriqué"
            echo "ok=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$KEY_B64" | base64 -d > "$RUNNER_TEMP/retrogems.jks"
          echo "ok=1" >> "$GITHUB_OUTPUT"

      - name: APK
        if: steps.cle.outputs.ok == '1'
        shell: bash
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: |
          export KEYSTORE_FILE="$RUNNER_TEMP/retrogems.jks" VERSION_NAME="$VER"
          gradle -p android assembleRelease --no-daemon --stacktrace
          cp android/app/build/outputs/apk/release/app-release.apk "RetroGems_${VER}_android.apk"

      - name: Publier l'APK
        if: steps.cle.outputs.ok == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VER }}
          name: RetroGems v${{ env.VER }}
          files: RetroGems_${{ env.VER }}_android.apk
